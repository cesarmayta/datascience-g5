<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicción de Precio de Casas en Europa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        select {
            cursor: pointer;
            background-color: white;
            appearance: none;
            padding-right: 40px;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667eea' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 20px;
            padding-right: 40px;
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            margin: 30px 0;
            border-radius: 1px;
        }

        .price-section {
            text-align: center;
            background: #f8f9fb;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .price-label {
            color: #999;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .price-value {
            font-size: 42px;
            font-weight: 700;
            color: #667eea;
        }

        .price-currency {
            font-size: 18px;
            margin-left: 8px;
            color: #764ba2;
        }

        .btn-calculate {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-calculate:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .price-value {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PREDICCIÓN DE PRECIO DE CASAS EN EUROPA</h1>
        <div class="subtitle">Estima el valor de tu propiedad</div>

        <form method="POST">
            <div class="form-group">
                <label for="region">Región</label>
                <select id="region" name="region_value">
                    {%for region in regiones %}
                        <option value="{{region}}">{{region}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="habitaciones">Nro Habitaciones</label>
                <input type="text" id="habitaciones" name="rooms" placeholder="Ej: 3">
            </div>

            <div class="form-group">
                <label for="distancia">Distancia</label>
                <input type="text" id="distancia" name="distance" placeholder="Ej: 5 km">
            </div>

            <button type="submit" class="btn-calculate">Calcular Precio con IA</button>
        </form>

        <div class="divider"></div>

        {% if precio > 0 %}
        <div class="price-section">
            <div class="price-label">Precio Estimado</div>
            <div>
                <span class="price-value">{{precio}}</span>
                <span class="price-currency">€</span>
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
